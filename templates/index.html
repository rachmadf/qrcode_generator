<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Code Generator</title>
</head>

<body>

    <h1>QR Code Generator</h1>

    <p>Enter text or a URL to generate a QR code.</p>

    <form method="POST">

        <div>
            <label for="data">Text or URL</label>
            <br>
            <textarea
                id="data"
                name="data"
                rows="4"
                cols="50"
                placeholder="Enter text or URL"
                required
            ></textarea>
        </div>

        <br>

        <div>
            <label for="filename">Filename</label>
            <br>
            <input
                type="text"
                id="filename"
                name="filename"
                placeholder="qrcode"
            >
            <small>.png will be added automatically.</small>
        </div>

        <br>

        <button type="submit">Generate QR Code</button>

    </form>

    {% if error %}
        <p>
            <strong>Error:</strong> {{ error }}
        </p>
    {% endif %}

    {% if qr_filename %}
        <hr>

        <h2>Generated QR Code</h2>

        <img
            src="{{ url_for('static', filename='generated/' + qr_filename) }}"
            alt="Generated QR Code"
        >

        <p>
            <a
                href="{{ url_for('static', filename='generated/' + qr_filename) }}"
                download
            >
                Download QR Code
            </a>
        </p>
    {% endif %}

</body>
</html>
